<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>GreenMap AI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow-x:hidden;width:100%;}

  #splashScreen{
    position:fixed; inset:0; z-index:100;
    background:#0B3B24;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overflow:hidden;
  }
  #splashScreen .glow{
    position:absolute;
    width:900px;height:900px;
    background:radial-gradient(circle, rgba(126,217,87,0.14) 0%, rgba(1,21,14,0) 70%);
    top:50%;left:50%;
    transform:translate(-50%,-52%);
    pointer-events:none;
  }
  #splashScreen .logo{
    width:min(96vw, 720px);
    opacity:0;
    transform:scale(0.94);
    animation: appear 1.1s ease-out forwards;
    position:relative;
    z-index:2;
    display:block;
  }
  @keyframes appear{
    to{opacity:1; transform:scale(1);}
  }
  #splashScreen .footer{
    position:absolute;
    bottom:34px;
    left:0; right:0;
    text-align:center;
    z-index:2;
    opacity:0;
    animation: fadein 1s ease-out 0.6s forwards;
  }
  @keyframes fadein{ to{opacity:1;} }
  #splashScreen .footer .credit{
    font-size:13.5px;
    letter-spacing:0.3px;
    color:rgba(232,243,236,0.7);
    font-weight:400;
  }
  #splashScreen .footer .credit b{
    font-weight:500;
    color:rgba(232,243,236,0.85);
  }
  #splashScreen .dots{
    position:absolute;
    bottom:92px;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap:7px;
    z-index:2;
    opacity:0;
    animation: fadein 1s ease-out 0.9s forwards;
  }
  #splashScreen .dots span{
    width:6px;height:6px;border-radius:50%;
    background:#16A34A;
    animation: pulse 1.2s ease-in-out infinite;
  }
  #splashScreen .dots span:nth-child(2){animation-delay:0.15s;}
  #splashScreen .dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes pulse{
    0%,100%{opacity:0.3; transform:scale(0.85);}
    50%{opacity:1; transform:scale(1.15);}
  }
  #splashScreen.fade-out{animation: fadeOutScreen 0.5s ease-in forwards;}
  @keyframes fadeOutScreen{ to{opacity:0;} }


  :root{
    --primary:#1B4332; --primary2:#2D6A4F; --primaryDeep:#224E3B; --mint:#95D5B2;
    --accent:#FFB703; --accentDeep:#B8860B; --sky:#219EBC; --skyDeep:#0B4C68;
    --bg:#F7FAF7; --card:#E9F4EC; --textDark:#1B2B22; --textMuted:#5C6F63; --line:#DCEAE1;
  }
  #homeScreen{display:none;background:var(--bg);color:var(--textDark);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  #homeScreen.active{display:block;}
  #homeScreen .serif{font-family:Georgia,'Cambria',serif;}

  #homeScreen .topbar{background:var(--primary);color:#fff;padding:14px 20px;position:sticky;top:0;z-index:30;}
  #homeScreen .topbar-inner{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
  #homeScreen .topbar-row1{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  #homeScreen .topbar-row2{display:flex;justify-content:flex-end;}
  #homeScreen .profile-group{display:flex;align-items:center;gap:10px;}
  #homeScreen .avatar{width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  #homeScreen .avatar img{width:100%;height:100%;object-fit:contain;}
  #homeScreen .avatar-fallback{font-weight:800;color:var(--primary);font-size:16px;}
  #homeScreen .app-name{font-weight:700;font-size:16.5px;line-height:1.15;}
  #homeScreen .app-name-sub{font-size:10px;color:var(--mint);letter-spacing:1px;}

  #homeScreen .topbar-right{display:flex;align-items:center;flex-shrink:0;}
  #homeScreen .loc-temp-pill{display:flex;align-items:center;gap:5px;background:var(--primaryDeep);border-radius:999px;padding:4px 8px;font-size:10px;white-space:nowrap;flex-shrink:0;}
  #homeScreen .loc-temp-pill .sep{opacity:.5;}
  #homeScreen .bell-btn{width:28px;height:28px;border-radius:8px;background:var(--primaryDeep);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;font-size:13px;}
  #homeScreen .bell-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);}

  #homeScreen .white-section{background:#fff;padding:22px 20px 24px;}
  #homeScreen .white-inner{max-width:1240px;margin:0 auto;}
  #homeScreen .greeting{font-size:22px;font-weight:700;color:var(--textDark);}
  #homeScreen .greeting-sub{font-size:13.5px;color:var(--textMuted);margin-top:3px;}

  #homeScreen .options-placeholder{margin-top:18px;border:2px dashed var(--line);border-radius:16px;min-height:110px;display:flex;align-items:center;justify-content:center;color:var(--textMuted);font-size:13px;background:var(--card);}

  #homeScreen .menu-btn{width:38px;height:38px;border-radius:9px;background:var(--primaryDeep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0;border:none;cursor:pointer;}
  #homeScreen .menu-btn span{width:18px;height:2px;background:#fff;border-radius:2px;display:block;}

  #homeScreen .menu-overlay{position:fixed;inset:0;background:rgba(9,26,17,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  #homeScreen .menu-overlay.open{opacity:1;pointer-events:auto;}
  #homeScreen .menu-panel{position:fixed;top:0;left:0;bottom:0;width:min(78vw,300px);background:#fff;z-index:95;transform:translateX(-105%);transition:transform .22s ease;box-shadow:6px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column;}
  #homeScreen .menu-panel.open{transform:translateX(0);}
  #homeScreen .menu-profile{background:var(--primary);color:#fff;padding:26px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;}
  #homeScreen .menu-avatar{width:64px;height:64px;border-radius:50%;background:#EDF2EF;overflow:hidden;border:2px solid rgba(255,255,255,.5);}
  #homeScreen .menu-avatar img{width:100%;height:100%;object-fit:cover;}
  #homeScreen .menu-username{font-weight:700;font-size:15.5px;}
  #homeScreen .menu-login-btn{margin-top:2px;background:var(--accent);color:var(--primaryDeep);border:none;border-radius:999px;padding:9px 26px;font-weight:700;font-size:13.5px;cursor:pointer;}
  #homeScreen .menu-login-btn.logged-in{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);}
  #homeScreen .menu-items{padding:10px 0;flex:1;}
  #homeScreen .menu-item{display:flex;align-items:center;gap:12px;padding:14px 20px;font-size:14.5px;color:var(--textDark);cursor:pointer;border-bottom:1px solid var(--line);}
  #homeScreen .menu-item:hover{background:var(--card);}
  #homeScreen .menu-item-icon{width:20px;text-align:center;}

  /* Notification panel (slides from right) */
  #homeScreen .notif-overlay{position:fixed;inset:0;background:rgba(9,26,17,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  #homeScreen .notif-overlay.open{opacity:1;pointer-events:auto;}
  #homeScreen .notif-panel{position:fixed;top:0;right:0;bottom:0;width:min(85vw,340px);background:#fff;z-index:95;transform:translateX(105%);transition:transform .22s ease;box-shadow:-6px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column;}
  #homeScreen .notif-panel.open{transform:translateX(0);}
  #homeScreen .notif-header{background:var(--primary);color:#fff;padding:18px 20px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
  #homeScreen .notif-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;}
  #homeScreen .notif-items{flex:1;overflow-y:auto;}
  #homeScreen .notif-item{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;}
  #homeScreen .notif-item:hover{background:var(--card);}
  #homeScreen .notif-icon{font-size:20px;flex-shrink:0;}
  #homeScreen .notif-title{font-size:13.5px;font-weight:700;color:var(--textDark);}
  #homeScreen .notif-sub{font-size:12px;color:var(--textMuted);margin-top:2px;}

</style>
</head>
